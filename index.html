<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMI SoundBoard 🎵 (React Cloud Edition)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
        /* ─── DESIGN TOKENS ─── */
    :root {
      --bg:        #f8f9fa;
      --surface:   #ffffff;
      --surface2:  #f1f3f5;
      --border:    #e9ecef;
      --accent:    #FF76A5;
      --accent2:   #4EA0E2;
      --accent3:   #FE6F17;
      --text:      #212529;
      --muted:     #868e96;
      --danger:    #fa5252;
      --success:   #40c057;
      --radius:    16px;
      --shadow:    0 8px 32px rgba(0,0,0,0.05);
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── LAYOUT ─── */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ─── HEADER ─── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
        .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #1a1a1a;
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }
    .logo-icon {
      font-size: 2.8rem;
    }
    header p {
      color: var(--muted);
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    /* ─── STATS BAR ─── */
    .stats-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-chip span { color: var(--text); font-weight: 600; }

    /* ─── UPLOAD ZONE ─── */
    .upload-section {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .upload-section::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,92,252,0.04), rgba(224,64,251,0.04));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .upload-section:hover,
    .upload-section.drag-over {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .upload-section:hover::before,
    .upload-section.drag-over::before { opacity: 1; }
    .upload-section.drag-over { border-color: var(--accent2); background: rgba(224,64,251,0.05); }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .upload-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .upload-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ─── RENAME INPUT ─── */
    .upload-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .upload-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }
    .input-field {
      flex: 1;
      min-width: 180px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }
    .input-field::placeholder { color: var(--muted); }

    /* ─── EMOJI PICKER ─── */
    .emoji-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }
    .emoji-btn {
      background: var(--surface2);
      border: 1.5px solid transparent;
      border-radius: 8px;
      width: 38px; height: 38px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .emoji-btn:hover { background: var(--surface); transform: scale(1.15); }
    .emoji-btn.selected { border-color: var(--accent); background: rgba(124,92,252,0.18); }

    /* ─── COLOR PICKER ROW ─── */
    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch:hover { transform: scale(1.2); }
    .color-swatch.selected { border-color: #fff; transform: scale(1.15); }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255,118,165,0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 28px rgba(124,92,252,0.5); filter: brightness(1.1); }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: rgba(255,69,96,0.12);
      color: var(--danger);
      border: 1px solid rgba(255,69,96,0.2);
    }
    .btn-danger:hover { background: rgba(255,69,96,0.22); }

    /* ─── FILE INPUT HIDDEN ─── */
    #fileInput { display: none; }

    /* ─── SECTION HEADER ─── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      border-radius: 50px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* ─── SEARCH ─── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 240px;
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--muted);
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 10px 14px 10px 36px;
    }

        /* ─── BUZZER GRID ─── */
    .buzzer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 50px 20px;
      justify-items: center;
      padding-top: 20px;
      margin-bottom: 50px;
    }

    /* ─── BUZZER CARD ─── */
    .buzzer-card {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--card-color, #4EA0E2);
      border: 4px solid var(--surface);
      box-shadow: 
        0 14px 0 var(--card-shadow, rgba(0,0,0,0.15)), 
        0 20px 20px rgba(0,0,0,0.1),
        inset 0 -5px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
      user-select: none;
      padding: 0;
    }
    
    .buzzer-card:hover { filter: brightness(1.05); }
    
    .buzzer-card:active, .buzzer-card.playing {
      transform: translateY(10px);
      box-shadow: 
        0 4px 0 var(--card-shadow, rgba(0,0,0,0.15)), 
        0 10px 15px rgba(0,0,0,0.05),
        inset 0 -2px 5px rgba(0,0,0,0.05);
    }

    .buzzer-card.playing { border-color: rgba(255,255,255,0.8); }

    .buzzer-emoji {
      font-size: 3rem;
      display: block;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
      transition: transform 0.2s;
      margin-top: -5px;
    }
    .buzzer-card:hover .buzzer-emoji { transform: scale(1.15) rotate(8deg); }

    .buzzer-name {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      position: absolute; 
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      text-align: center;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wave-indicator {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 30px;
      position: absolute;
      top: -45px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1;
    }
    .buzzer-card.playing .wave-indicator { opacity: 1; }
    .wave-bar {
      width: 6px;
      background: var(--card-color, #4EA0E2);
      border-radius: 4px;
      animation: wave-anim 0.6s ease-in-out infinite;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; background: var(--accent); }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.05s; background: var(--accent3); }
    @keyframes wave-anim { 0%, 100% { height: 8px; } 50% { height: 30px; } }

    /* ─── EDIT BUTTON ON CARD ─── */
    .card-edit {
      position: absolute;
      top: 0; right: -15px; left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.15s, transform 0.15s;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .buzzer-card:hover .card-edit { opacity: 1; }
    .card-edit:hover { background: var(--surface2); transform: scale(1.1); }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 0.95rem; }

    /* ─── TOAST ─── */
    .toast-container {
      position: fixed;
      bottom: 30px; right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }
    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      animation: slide-in 0.3s ease forwards;
      max-width: 320px;
    }
    .toast.success { border-color: rgba(0,230,118,0.3); }
    .toast.error   { border-color: rgba(255,69,96,0.3); }
    @keyframes slide-in {
      from { transform: translateX(100px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    @keyframes slide-out {
      from { transform: translateX(0);     opacity: 1; }
      to   { transform: translateX(100px); opacity: 0; }
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      width: 90%;
      max-width: 460px;
      box-shadow: var(--shadow);
      transform: translateY(20px) scale(0.96);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal { transform: none; }
    .modal h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .modal-form { display: flex; flex-direction: column; gap: 16px; }
    .modal-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
    .modal-actions { display: flex; gap: 12px; margin-top: 8px; justify-content: flex-end; }

    /* ─── VOLUME SLIDER ─── */
    .volume-row {
      display: flex; align-items: center; gap: 12px;
      margin-top: 8px;
    }
    .volume-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(124,92,252,0.4);
    }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .wrapper { padding: 20px 16px 80px; }
      .logo { font-size: 2.2rem; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .logo-icon { font-size: 2.2rem; }
      header p { font-size: 1rem; }
      
      .upload-section { padding: 20px 16px; margin-bottom: 30px; }
      .input-field { min-width: 100%; }
      .emoji-btn { width: 34px; height: 34px; font-size: 1.2rem; }
      
      .stats-bar { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 30px; }
      .stat-chip { justify-content: center; padding: 10px; }
      
      .section-header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .search-wrap { max-width: 100%; width: 100%; }
      
      .buzzer-grid { 
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
        gap: 45px 15px; 
      }
      .buzzer-card { width: 110px; height: 110px; border-width: 4px; box-shadow: 0 10px 0 var(--card-shadow, rgba(0,0,0,0.15)), 0 15px 20px rgba(0,0,0,0.1), inset 0 -4px 10px rgba(0,0,0,0.1); }
      .buzzer-card:active, .buzzer-card.playing { transform: translateY(6px); box-shadow: 0 4px 0 var(--card-shadow, rgba(0,0,0,0.15)), 0 8px 10px rgba(0,0,0,0.05), inset 0 -2px 5px rgba(0,0,0,0.05); }
      .buzzer-emoji { font-size: 2.4rem; }
      .buzzer-name { width: 120px; font-size: 0.85rem; bottom: -30px; }
      .wave-indicator { top: -35px; }
    }
  
    /* ─── UPLOAD FULL COLLAPSE ─── */
    .upload-collapse {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0, 1, 0, 1), opacity 0.3s, margin 0.3s;
      margin-bottom: 0;
    }
    .upload-collapse.open {
      max-height: 800px;
      opacity: 1;
      margin-bottom: 40px;
      transition: max-height 0.6s ease-in-out, opacity 0.4s 0.1s, margin 0.4s;
    }
    
    /* ─── FAB ADD BUTTON ─── */
    .fab-add {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 2.5rem;
      border: none;
      box-shadow: 0 8px 25px rgba(255,118,165,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
      z-index: 100;
      line-height: 1;
    }
    .fab-add:hover {
      transform: scale(1.1);
      background: var(--accent3);
      box-shadow: 0 12px 30px rgba(254,111,23,0.4);
    }
    .fab-add.rotate {
      transform: rotate(135deg);
      background: var(--danger);
      box-shadow: 0 8px 25px rgba(250,82,82,0.4);
    }
    
    /* ─── MEDIA QUERY ADDITIONS ─── */
    @media (max-width: 600px) {
      .fab-add { bottom: 20px; right: 20px; width: 60px; height: 60px; font-size: 2rem; }
    }

  </style>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- JSX Compiler (Babel standalone) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔸 CONFIGURATION FIREBASE À REMPLACER 🔸
    const firebaseConfig = {
      apiKey: "AIzaSyDD2ljz3Sdoz3CSnCQcLjoDJ39cQuuS3dY",
      authDomain: "mmisound.firebaseapp.com",
      projectId: "mmisound",
      storageBucket: "mmisound.firebasestorage.app",
      messagingSenderId: "596948796682",
      appId: "1:596948796682:web:54193a42b769102a22a6f3",
      measurementId: "G-J4VG05G2NX"
    };

    // Firebase INIT
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const EMOJIS = ['🎵','🎶','🔔','🎸','🥁','🎹','🎺','🎻','🎙','📯','🔊','💥','🎉','🚨','🌊','🌟','🔥','💫','🎮','🕹'];
        const COLORS = [
      { name: 'Rose',   val: '#FF76A5', shadow: '#D04073' },
      { name: 'Bleu',   val: '#4EA0E2', shadow: '#2778B6' },
      { name: 'Orange', val: '#FE6F17', shadow: '#C84F05' },
      { name: 'Noir',   val: '#212529', shadow: '#000000' },
      { name: 'Vert',   val: '#40c057', shadow: '#2b8a3e' },
      { name: 'Violet', val: '#7c5cfc', shadow: '#5635D0' },
    ];
    const COLOR_SWATCHES = COLORS.map(c => c.val);

    const Toast = ({ toasts }) => (
      <div className="toast-container">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.type}`} style={{animation: t.closing ? 'slide-out 0.3s ease forwards' : 'slide-in 0.3s ease forwards'}}>
            <span>{t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️'}</span>
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    );

    function App() {
      const [sounds, setSounds] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [searchFilter, setSearchFilter] = useState('');
      const [isUploadOpen, setIsUploadOpen] = useState(false);
      
      const [selectedEmoji, setSelectedEmoji] = useState(EMOJIS[0]);
      const [selectedColor, setSelectedColor] = useState(COLORS[0].val);
      const [customName, setCustomName] = useState('');
      
      const [playingId, setPlayingId] = useState(null);
      const [lastPlayedName, setLastPlayedName] = useState('–');
      const audioRef = useRef(null);
      const fileInputRef = useRef(null);

      const [editModalOpen, setEditModalOpen] = useState(false);
      const [editingSound, setEditingSound] = useState(null);
      const [editName, setEditName] = useState('');
      const [editEmoji, setEditEmoji] = useState('');
      const [editColor, setEditColor] = useState('');
      const [editVolume, setEditVolume] = useState(100);

      const addToast = (msg, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => {
          setToasts(prev => prev.map(t => t.id === id ? { ...t, closing: true } : t));
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 300);
        }, 3000);
      };

      useEffect(() => {
        try {
          const unsubscribe = db.collection('sounds').orderBy('addedAt').onSnapshot((snapshot) => {
            const data = [];
            snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
            setSounds(data);
          }, err => {
            console.error(err);
            // Ignore error log if default empty config is failing
            if (!String(err).includes("API key")) {
                addToast('Erreur DB Firebase', 'error');
            }
          });
          return () => unsubscribe();
        } catch(e) {
          console.error("Firebase info:", e);
        }
      }, []);

      const formatBytes = (b) => {
        if (b < 1024) return b + ' o';
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' Ko';
        return (b / (1024 * 1024)).toFixed(2) + ' Mo';
      };

      const totalSize = formatBytes(sounds.reduce((acc, s) => acc + (s.size || 0), 0));
      const filteredSounds = sounds.filter(s => s.name.toLowerCase().includes(searchFilter.toLowerCase()));

      const playSound = (sound) => {
        if (audioRef.current) {
          audioRef.current.pause();
        }
        const audio = new Audio(sound.url);
        audio.volume = (sound.volume ?? 100) / 100;
        audioRef.current = audio;
        
        setPlayingId(sound.id);
        setLastPlayedName(sound.name);

        audio.play().catch(() => addToast('Impossible de lire ce son', 'error'));
        audio.onended = () => {
          setPlayingId(null);
          audioRef.current = null;
        };
      };

      const handleFileChange = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        e.target.value = '';

        let importedCount = 0;
        for (const file of files) {
          if (!file.type.startsWith('audio/')) {
            addToast(`${file.name} n'est pas audio`, 'error');
            continue;
          }
          if (file.size > 700 * 1024) {
            addToast(`Le son "${file.name}" est trop lourd (Max 700Ko)`, 'error');
            continue;
          }

          const fallbackName = file.name.replace(/\.[^/.]+$/, '');
          const finalName = customName.trim() || fallbackName;

          const isDup = sounds.some(s => s.size === file.size || s.name.toLowerCase() === finalName.toLowerCase());
          if (isDup) {
            addToast(`"${finalName}" existe déjà`, 'error');
            continue;
          }

          addToast(`⏳ Conversion du son en texte (1/2)...`, 'info');

          try {
            const url = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = () => resolve(reader.result);
              reader.onerror = error => reject(error);
            });

            addToast(`🚀 Envoi vers Firestore (2/2)...`, 'info');

            const addPromise = db.collection("sounds").add({
              name: finalName,
              type: file.type,
              size: file.size,
              emoji: selectedEmoji,
              color: selectedColor,
              volume: 100,
              url: url,
              addedAt: new Date().toISOString()
            });

            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT_FIRESTORE")), 8000));
            
            await Promise.race([addPromise, timeoutPromise]);
            
            importedCount++;
          } catch(err) {
            console.error(err);
            if (err.message === "TIMEOUT_FIRESTORE") {
               addToast(`❌ Impossible de se connecter à Firestore. Avez-vous cliqué sur "Firestore Database" (orange) ou sur l'autre ?`, 'error');
            } else {
               addToast(`❌ Erreur: Firebase a refusé (Mode test désactivé ?)`, 'error');
            }
          }
        }
        
        if (importedCount > 0) {
          setCustomName('');
          addToast(`✨ ${importedCount} son(s) envoyé(s) !`);
        }
      };

      const handleDrop = async (e) => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
        if (files.length) {
          handleFileChange({ target: { files, value: '' } });
        }
      };

      const openEdit = (sound, e) => {
        e.stopPropagation();
        setEditingSound(sound);
        setEditName(sound.name);
        setEditEmoji(sound.emoji || EMOJIS[0]);
        setEditColor(sound.color || COLORS[0].val);
        setEditVolume(sound.volume ?? 100);
        setEditModalOpen(true);
      };

      const saveEdit = async () => {
        if (!editingSound) return;
        try {
          await db.collection("sounds").doc(editingSound.id).update({
            name: editName.trim() || editingSound.name,
            emoji: editEmoji,
            color: editColor,
            volume: parseInt(editVolume, 10)
          });
          setEditModalOpen(false);
          addToast('Son modifié avec succès !', 'success');
        } catch(e) {
          console.error(e);
          addToast('Erreur lors de la modification', 'error');
        }
      };

      return (
        <div className="wrapper">
          <header>
            <div className="logo">
              <span className="logo-icon">🎛️</span> MMI SoundBoard
            </div>
            
          </header>

          <div className="stats-bar">
            <div className="stat-chip">🎵 Sons enregistrés : <span>{sounds.length}</span></div>
            
          </div>

          <div className={`upload-collapse ${isUploadOpen ? 'open' : ''}`}>
          <div 
            className="upload-section" 
            onDragOver={e => e.preventDefault()}
            onDrop={handleDrop}
            onClick={() => fileInputRef.current?.click()}
          >
            <span className="upload-icon">🎵</span>
            <div className="upload-title">Déposez vos fichiers MP3 ici</div>
            <div className="upload-sub">Tous les ajouts sont sauvegardés dans le cloud pour tout le monde.</div>

            <div className="upload-form" onClick={e => e.stopPropagation()}>
              <div className="upload-row">
                <input 
                  type="text" 
                  className="input-field" 
                  placeholder="Nom du son (optionnel)" 
                  value={customName}
                  onChange={e => setCustomName(e.target.value)}
                />
              </div>

              <div>
                <div className="modal-label" style={{marginBottom:'8px'}}>Choisir un emoji</div>
                <div className="emoji-picker">
                  {EMOJIS.map(em => (
                    <button 
                      key={em} 
                      type="button"
                      className={`emoji-btn ${selectedEmoji === em ? 'selected' : ''}`}
                      onClick={() => setSelectedEmoji(em)}
                    >{em}</button>
                  ))}
                </div>
              </div>

              <div>
                <div className="modal-label" style={{marginBottom:'8px'}}>Couleur du bouton</div>
                <div className="color-row">
                  {COLORS.map((c, i) => (
                    <button 
                      key={c.name}
                      type="button"
                      title={c.name}
                      className={`color-swatch ${selectedColor === c.val ? 'selected' : ''}`}
                      style={{background: COLOR_SWATCHES[i]}}
                      onClick={() => setSelectedColor(c.val)}
                    />
                  ))}
                </div>
              </div>

              <div className="upload-row" style={{justifyContent: 'center'}}>
                <button className="btn btn-primary" type="button" onClick={() => fileInputRef.current?.click()}>
                  <span>📂</span> Choisir un fichier
                </button>
              </div>
            </div>
            <input type="file" ref={fileInputRef} style={{display:'none'}} accept="audio/*" multiple onChange={handleFileChange} />
          </div>
          </div>

          <div className="section-header">
            <div className="section-title">
              🎤 Buzzers Partagés
              <span className="badge">{sounds.length}</span>
            </div>
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input 
                type="text" 
                id="searchInput"
                className="input-field" 
                placeholder="Rechercher..." 
                value={searchFilter}
                onChange={e => setSearchFilter(e.target.value)}
              />
            </div>
          </div>

          <div className="buzzer-grid">
            {filteredSounds.length === 0 ? (
              <div className="empty-state">
                <div className="icon">{searchFilter ? '🔍' : '🎧'}</div>
                <p>{searchFilter ? `Aucun résultat pour "${searchFilter}"` : `Aucun son pour l'instant !`}</p>
              </div>
            ) : (
              filteredSounds.map(sound => (
                <div 
                  key={sound.id} 
                  className={`buzzer-card ${playingId === sound.id ? 'playing' : ''}`}
                  style={{
                    '--card-color': sound.color || COLORS[0].val,
                    '--card-shadow': (COLORS.find(c => c.val === (sound.color || COLORS[0].val)) || {}).shadow || 'rgba(0,0,0,0.15)'
                  }}
                  onClick={() => playSound(sound)}
                >
                  <button className="card-edit" title="Modifier" onClick={e => openEdit(sound, e)}>✏️</button>
                  <span className="buzzer-emoji">{sound.emoji || '🎵'}</span>
                  <div className="buzzer-name">{sound.name}</div>
                  <div className="wave-indicator">
                    <div className="wave-bar"></div>
                    <div className="wave-bar"></div>
                    <div className="wave-bar"></div>
                    <div className="wave-bar"></div>
                  </div>
                </div>
              ))
            )}
          </div>

          <button className={`fab-add ${isUploadOpen ? 'rotate' : ''}`} onClick={() => setIsUploadOpen(!isUploadOpen)}>➕</button>
          <footer>MMI SoundBoard &copy; 2026 · Quentin PERIGOT</footer>
          <Toast toasts={toasts} />

          {/* Edit Modal */}
          <div className={`modal-overlay ${editModalOpen ? 'open' : ''}`} onClick={() => setEditModalOpen(false)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <h2>✏️ Modifier le son</h2>
              <div className="modal-form">
                <div>
                  <div className="modal-label">Nom du son</div>
                  <input type="text" className="input-field" style={{width:'100%'}} value={editName} onChange={e => setEditName(e.target.value)} />
                </div>
                <div>
                  <div className="modal-label">Emoji</div>
                  <div className="emoji-picker">
                    {EMOJIS.map(em => (
                      <button key={em} type="button" className={`emoji-btn ${editEmoji === em ? 'selected' : ''}`} onClick={() => setEditEmoji(em)}>{em}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div className="modal-label">Couleur</div>
                  <div className="color-row">
                    {COLORS.map((c, i) => (
                      <button key={c.name} type="button" className={`color-swatch ${editColor === c.val ? 'selected' : ''}`} style={{background: COLOR_SWATCHES[i]}} onClick={() => setEditColor(c.val)} />
                    ))}
                  </div>
                </div>
                <div className="volume-row">
                  <label>🔊 Volume</label>
                  <input type="range" min="0" max="100" value={editVolume} onChange={e => setEditVolume(e.target.value)} />
                  <span style={{fontSize:'0.85rem', color:'var(--muted)', minWidth:'34px'}}>{editVolume}%</span>
                </div>
              </div>
              <div className="modal-actions">
                <button className="btn btn-ghost" onClick={() => setEditModalOpen(false)}>Annuler</button>
                <button className="btn btn-primary" onClick={saveEdit}>💾 Enregistrer</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
